name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --check

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Install Windows cross toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ticktune.exe dist/
          cd dist && sha256sum ticktune.exe > ticktune.exe.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/ticktune.exe dist/ticktune.exe.sha256 --clobber
