name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Windows cross toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Format
        run: cargo fmt --check

      - name: Clippy (host, all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Build (Windows)
        run: cargo build --release --target x86_64-pc-windows-gnu

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test

      - name: "Smoke: query"
        run: cargo run --release -- query

      - name: "Smoke: measure"
        run: cargo run --release -- measure --samples 20
