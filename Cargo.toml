[package]
name = "ticktune"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Measure the Windows timer resolution that actually fits the machine, then apply it"
license = "MIT"
repository = "https://github.com/daika7ana/ticktune"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
